name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validar configuracion de Prometheus y Grafana
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validar prometheus.yml con promtool
        run: |
          docker run --rm --entrypoint promtool \
            -v "$PWD/prometheus:/cfg:ro" \
            prom/prometheus:latest check config /cfg/prometheus.yml

      - name: Validar dashboards de Grafana (JSON bien formado)
        run: |
          for f in grafana/dashboards/*.json; do
            echo "Validando $f"
            python3 -m json.tool "$f" > /dev/null
          done

      - name: Validar archivos de provisioning (YAML bien formado)
        run: |
          pip install --quiet pyyaml
          for f in grafana/provisioning/datasources/*.yml grafana/provisioning/dashboards/*.yml; do
            echo "Validando $f"
            python3 -c "import yaml,sys; yaml.safe_load(open(sys.argv[1]))" "$f"
          done
